name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The lock file pins CUDA wheels (~3 GB); CI only needs the CPU build.
      - name: Install the CPU stack
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install numpy pillow fastapi "uvicorn[standard]" python-multipart pytest httpx scikit-learn pandas

      - name: Run the test suite
        # No checkpoints, no Food-101 images: the suite covers class tables,
        # input validation and the calorie maths.
        run: python -m pytest tests -q
